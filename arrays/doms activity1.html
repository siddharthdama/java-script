<!DOCTYPE html>
<html>
<head>
  <title>My Zoo</title>
  <style>

    body {
      font-family: Arial, sans-serif;
      background: aliceblue;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #ff5a43;
    }

    #zoo {
      border: 2px solid #ff5a43;
      width: 300px;
      margin: 16px auto;
      padding: 12px;
      border-radius: 10px;
      background: white;
    }

    .zone {
      border: 1px solid #ff5a43;
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: left;
    }

    button {
      background: #ff5a43;
      color: white;
      padding: 10px 24px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

  </style>
</head>
<body>

<h1>Welcome to My Zoo</h1>
<p>use javascript to interact with the DOM to create and add animals in this lovely zoo!</p>
<div id="zoo">
    <div class="zone" > zone 1: <span id="zone1"></span> </div>
    <div class="zone" > zone 2: <span id="zone2"></span> </div>
    <div class="zone" > zone 3: <span id="zone3"></span> </div>
    <div class="zone" > zone 4: <span id="zone4"></span> </div>
</div>
<br>
<button onclick="openZoo()">Open Zoo</button>
<p id="zoo status"></p>
 <script>
    function openZoo() {
        let animals = ["Lion", "Tiger", "Bear", "Elephant"];
        document.getElementById("zone1").innerHTML = "lion";
        document.getElementById("zone2").innerHTML = "tiger";
        document.getElementById("zone3").innerHTML = "bear";
        document.getElementById("zone4").innerHTML = "elephant";
        document.getElementById("zoo status").innerHTML = "The zoo is now open!";
        document.getElementById("zoo").style.backgroundColor = "lightgreen";
    }
  </script>
</body>
</html>
