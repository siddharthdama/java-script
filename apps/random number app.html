<html>
    <body>
        <h1>Random Number Generator</h1>
        <p>Click the button to generate a random number:</p>
        <button onclick="generateRandomNumber()">Generate Random Number</button>
        <p id="result"></p>

        <script>
            function generateRandomNumber() {
                var randomNumber = Math.floor(Math.random() * 100) + 1; // Generates a random number between 1 and 100
                document.getElementById("result").innerHTML = "Random Number: " + randomNumber;
            }
        </script>
    </body>
</html>
