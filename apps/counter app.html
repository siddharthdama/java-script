<!DOCTYPE html>
<html>
    <head>
        <title>Counter App</title>
        <style>
            body {
                background-color: #0328fa;
                font-family: Arial, sans-serif;
                text-align: center;
                margin-top: 50px;
            }
            button {
                padding: 10px 20px;
                font-size: 16px;
                margin: 5px;
                background-color: #fff;
                border: none;
                cursor: pointer;
            }
            button:hover {
                background-color: #01fe11;
            }
            #count {
                font-size: 24px;
                margin-top: 20px;
            }
        </style>
    </head>
    <body>
        <h1>Counter App</h1>
        <button onclick="increment()">Increment</button>
        <button onclick="decrement()">Decrement</button>
        <button onclick="reset()">Reset</button>
        <div id="count">0</div>

        <script>
            let count = 0;

            function increment() {
                count++;
                document.getElementById("count").innerText = count;
            }

            function decrement() {
                count--;
                document.getElementById("count").innerText = count;
            }

            function reset() {
                count = 0;
                document.getElementById("count").innerText = count;
            }
        </script>
    </body>
