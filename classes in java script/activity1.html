<!DOCTYPE html>
<html>
<head>
  <title>My Planet Cards</title>
  <style>
    body {
      font-family: Arial;
      background: #01aef8;
      padding: 30px;
      text-align: center;
    }
    h1 { color: #f73b02; }
    p { color: #288e13; }
    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
    }
    .card {
      background: white;
      border: 3px solid #f73b02;
      border-radius: 12px;
      padding: 20px;
      width: 200px;
    }
    .planet-name {
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }
    .planet-fact { color: #666; margin-top: 10px; font-size: 14px; }
    button {
      background: #f73b02;
      color: rgb(3, 36, 249);
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>My Planet Cards</h1>
  <p>Use a JavaScript class to build planet cards!</p>
  <button onclick="showPlanets()">Show Planets!</button>
  <div class="cards">
    <div id="card1"></div>
    <div id="card2"></div>
    <div id="card3"></div>
      <div id="card5"></div>
    <div id="card4"></div>
    <div id="card6"></div>
     <div id="card7"></div>
      <div id="card8"></div>
  </div>
  <script>
    class Planet {
      constructor(name, fact) {
        this.name = name;
        this.fact = fact;
      } 

      describe() {
        return this.name + ": " + this.fact;
      }
    }

    function showPlanets() {
      let p1 = new Planet("Earth", "The only planet with life");
      let p2 = new Planet("Mars", "Known as the Red Planet");
      let p3 = new Planet("Saturn", "Has rings made of ice");
       let p4 = new Planet("Jupiter", "The largest planet in our solar system");
      let p5 = new Planet("Venus", "The hottest planet in our solar system");
      let p6 = new Planet("Neptune", "The windiest planet in our solar system");
  let p7 = new Planet("Venus", "The hottest planet in our solar system");
      let p8 = new Planet("Neptune", "The windiest planet in our solar system");

      document.getElementById("card1").innerHTML =
        "<div class='card'><div class='planet-name'>" + p1.name + "</div>" +
        "<div class='planet-fact'>" + p1.describe() + "</div></div>";

      document.getElementById("card2").innerHTML =
        "<div class='card'><div class='planet-name'>" + p2.name + "</div>" +
        "<div class='planet-fact'>" + p2.describe() + "</div></div>";

      document.getElementById("card3").innerHTML =
        "<div class='card'><div class='planet-name'>" + p3.name + "</div>" +
        "<div class='planet-fact'>" + p3.describe() + "</div></div>";

      document.getElementById("card4").innerHTML =
        "<div class='card'><div class='planet-name'>" + p4.name + "</div>" +
        "<div class='planet-fact'>" + p4.describe() + "</div></div>";

      document.getElementById("card5").innerHTML =
        "<div class='card'><div class='planet-name'>" + p5.name + "</div>" +
        "<div class='planet-fact'>" + p5.describe() + "</div></div>";

      document.getElementById("card6").innerHTML =
        "<div class='card'><div class='planet-name'>" + p6.name + "</div>" +
        "<div class='planet-fact'>" + p6.describe() + "</div></div>";

      document.getElementById("card7").innerHTML =
        "<div class='card'><div class='planet-name'>" + p7.name + "</div>" +
        "<div class='planet-fact'>" + p7.describe() + "</div></div>";

      document.getElementById("card8").innerHTML =
        "<div class='card'><div class='planet-name'>" + p8.name + "</div>" +
        "<div class='planet-fact'>" + p8.describe() + "</div></div>";    }
  </script>
</body>
</html>
