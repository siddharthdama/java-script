<!DOCTYPE html>
<html>
    <head>
        <title>methods in JavaScript</title>
    </head>
    <body>
        <h1>Methods in JavaScript</h1>
        <script>
        var name="SidDhArtH";
        document.write(name.toUpperCase());
        document.write("<br>");
        document.write(name.toLowerCase());
        document.write("<br>");
        document.write(name.startsWith("T"));

        </script>
    </body>
</html>
