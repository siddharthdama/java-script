<!DOCTYPE html>
<html>
    <head>
        <title>Loops in JavaScript</title>
    </head>
    <body>
        <h1>Loops in JavaScript</h1>
        <script>
       var fruits=["Apple","Banana","Mango","Orange"];
       var text=""
         for(var i=0;i<fruits.length;i++){
                text+=fruits[i]+"<br>";
        }
        document.write(text);
    </script>
</body>
</html>
