<!DOCTYPE html>
<html>
    <head>
        <title>scope</title>
    </head>
    <body>
 <h1>scope of variables in java script</h1>
 <button onclick="myFunction()">start</button>
 <p id="demo"></p>
 <p id="demo1"></p>
 <script>
    var a=5
function myFunction(){
var b=10
document.getElementById("demo").innerHTML = a;
}
document.getElementById("demo1").innerHTML = b;
 </script>

    </body>
</html>
